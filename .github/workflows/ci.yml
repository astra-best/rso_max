name: CI

on:
  # PR patterns select the target branch. Main_test remains during transition.
  pull_request:
    branches:
      - main
      - develop
      - Main_test
      - "integration/**"
      - "review/**"
  push:
    branches:
      - main
      - develop
      - Main_test
      - "integration/**"
      - "review/**"

permissions:
  contents: read

env:
  APP_ENV: test
  SECRET_KEY: ci-only-secret-key-not-for-production-123456
  INTERNAL_API_TOKEN: ci-only-internal-api-token
  ALLOW_INSECURE_DEV_API: "false"
  ENABLE_1C_INTEGRATION: "false"
  INTEGRATION_1C_MOCK: "true"
  BOOTSTRAP_ADMIN_PASSWORD: ""
  TOKEN: ""

jobs:
  fast:
    name: Fast CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV_FILE: .env.example
      APP_RUNTIME_ENV_FILE: .env.runtime.example
      DEPLOY_APP_ENV: test
      RUNTIME_DIR: /tmp/rso-ci-runtime
      WEB_BIND_PORT: "5000"
      IMAGE_NAME: rso-max:ci

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q -f -x '(^|[\\/])(\.git|\.venv)([\\/]|$)' .

      - name: Run blocking Ruff checks
        run: ruff check . --select E9,F63,F7,F82

      - name: Run quick unit tests
        run: >-
          DB_PATH="$RUNNER_TEMP/rso-ci.sqlite" LOG_FILE="$RUNNER_TEMP/rso-ci.log"
          python -m pytest -q -p no:cacheprovider tests/test_gunicorn_config.py
          tests/test_module_guards.py
          tests/test_1c_json_import.py

      - name: Verify legacy database migration preserves data
        run: |
          export DB_PATH="$RUNNER_TEMP/rso-migration.sqlite"
          export LOG_FILE="$RUNNER_TEMP/rso-migration.log"
          python - <<'PY'
          import sqlite3
          import database

          with sqlite3.connect(database.DB_PATH) as connection:
              connection.execute(
                  "CREATE TABLE appeals (id INTEGER PRIMARY KEY, user_id INTEGER, "
                  "text TEXT, status TEXT)"
              )
              connection.execute(
                  "INSERT INTO appeals VALUES (41, 7, 'legacy test record', 'open')"
              )

          database.init_db()
          connection = database.get_conn()
          try:
              assert connection.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              legacy = connection.execute(
                  "SELECT user_id, text, status FROM appeals_legacy WHERE id = 41"
              ).fetchone()
              assert tuple(legacy) == (7, "legacy test record", "open")
              columns = {
                  row[1] for row in connection.execute("PRAGMA table_info(appeals)")
              }
              assert {"ticket_no", "channel", "status"} <= columns
          finally:
              connection.close()
          PY

      - name: Prepare isolated Compose runtime
        run: |
          mkdir -p "$RUNTIME_DIR"/{data,logs,backups,kv}
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build application Docker image
        timeout-minutes: 4
        run: docker compose --project-name rso-ci build api web bot

      - name: Start API and web containers
        timeout-minutes: 2
        run: docker compose --project-name rso-ci up --detach --wait api web

      - name: Smoke check API and web health endpoints
        run: |
          docker compose --project-name rso-ci exec -T api python -c \
            "import urllib.request; response=urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3); assert response.status == 200"
          docker compose --project-name rso-ci exec -T web python -c \
            "import urllib.request; response=urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3); assert response.status == 200"

      - name: Smoke test offline bot message handling
        run: >-
          DB_PATH="$RUNNER_TEMP/rso-bot-smoke.sqlite"
          LOG_FILE="$RUNNER_TEMP/rso-bot-smoke.log"
          python -m pytest -q -p no:cacheprovider tests/test_house_chats_flow.py
          tests/test_bot_1c.py

      - name: Show container logs after failure
        if: failure()
        run: docker compose --project-name rso-ci logs --no-color

      - name: Stop and remove CI containers
        if: always()
        run: docker compose --project-name rso-ci down --volumes --remove-orphans

  full:
    name: Full CI
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run full unit and integration suite
        run: >-
          DB_PATH="$RUNNER_TEMP/rso-full.sqlite" LOG_FILE="$RUNNER_TEMP/rso-full.log"
          python -m pytest -q -p no:cacheprovider

      - name: Check database migration and backup restore
        run: |
          export DB_PATH="$RUNNER_TEMP/rso-full-source.sqlite"
          export LOG_FILE="$RUNNER_TEMP/rso-full.log"
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          import database

          source_path = Path(os.environ["DB_PATH"])
          backup_path = source_path.with_name("rso-full-backup.sqlite")
          restored_path = source_path.with_name("rso-full-restored.sqlite")

          with sqlite3.connect(source_path) as connection:
              connection.execute(
                  "CREATE TABLE appeals (id INTEGER PRIMARY KEY, user_id INTEGER, "
                  "text TEXT, status TEXT)"
              )
              connection.execute(
                  "INSERT INTO appeals VALUES (41, 7, 'legacy test record', 'open')"
              )
          database.init_db()
          with sqlite3.connect(source_path) as source:
              assert source.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              legacy = source.execute(
                  "SELECT user_id, text, status FROM appeals_legacy WHERE id = 41"
              ).fetchone()
              assert legacy == (7, "legacy test record", "open")
              columns = {
                  row[1] for row in source.execute("PRAGMA table_info(appeals)")
              }
              assert {"ticket_no", "channel", "status"} <= columns
          with sqlite3.connect(source_path) as source, sqlite3.connect(backup_path) as backup:
              source.backup(backup)
          with sqlite3.connect(backup_path) as backup, sqlite3.connect(restored_path) as restored:
              backup.backup(restored)
          with sqlite3.connect(restored_path) as restored:
              assert restored.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
              legacy = restored.execute(
                  "SELECT user_id, text, status FROM appeals_legacy WHERE id = 41"
              ).fetchone()
              assert legacy == (7, "legacy test record", "open")
              columns = {
                  row[1] for row in restored.execute("PRAGMA table_info(appeals)")
              }
              assert {"ticket_no", "channel", "status"} <= columns
          PY

      - name: Reject high-severity Bandit findings
        run: bandit -r . -x ./tests -lll

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt --strict
